name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # msbuild is not on PATH under `shell: powershell` — this action adds it.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # The runner image has no .NET 3.5 feature, hence no v2.0 targeting pack (MSB3644).
      - name: Install .NET Framework 3.5 targeting pack (for the net2 side)
        run: |
          DISM /Online /Enable-Feature /FeatureName:NetFx3ServerFeatures /All /NoRestart | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          DISM /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The runner has no v4.0 targeting pack (only 4.8), and retargeting to 4.8
      # would drop targets on older 4.x runtimes — so feed MSBuild the official
      # v4.0 reference assemblies from NuGet instead.
      - name: Fetch v4.0 reference assemblies
        run: |
          nuget install Microsoft.NetFramework.ReferenceAssemblies.net40 -Version 1.0.3 `
            -OutputDirectory refasms -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # One image per (arch × CLR side) — the Assets-table rows resolve on
      # windows + netframework2/netframework4 + i386/x86_64/aarch64, so the asset
      # names carry the same vocabulary: csharp-agent-<side>-<arch>.dll.
      - name: Build all six images (Release)
        shell: powershell
        run: |
          $sides  = @(@('net2','v2.0'), @('net4','v4.0'))
          $arches = @(@('i386','x86'), @('x86_64','x64'), @('aarch64','ARM64'))
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($s in $sides) {
            # net2 resolves via the installed .NET 3.5 feature; net4 via the NuGet
            # reference assemblies above. MSBuild reads properties from env vars.
            if ($s[0] -eq 'net4') {
              $pkg = Get-ChildItem refasms -Directory -Filter 'Microsoft.NetFramework.ReferenceAssemblies.net40*' | Select-Object -First 1
              $env:TargetFrameworkRootPath = "$($pkg.FullName)\build\.NETFramework"
            } else {
              Remove-Item Env:TargetFrameworkRootPath -ErrorAction SilentlyContinue
            }
            foreach ($a in $arches) {
              msbuild csharp-agent.csproj -restore `
                -p:Configuration=Release -p:Platform=$($a[1]) -p:TargetFrameworkVersion=$($s[1]) `
                -nologo -verbosity:minimal
              if ($LASTEXITCODE -ne 0) { exit 1 }
              Copy-Item "bin\$($a[1])\Release\csharp-agent.dll" "dist\csharp-agent-$($s[0])-$($a[0]).dll"
            }
          }
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csharp-agent
          path: dist/*.dll
          if-no-files-found: error

      # Rolling "preview" prerelease — the URLs the C2's Agents-table CSharp-Agent rows
      # point at (releases/download/preview/csharp-agent-<side>-<arch>.dll), same mechanism
      # as the Position-Independent-Agent and jscript-agent repos. Recreated on every main push.
      - name: Publish rolling preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --yes --cleanup-tag 2>$null; if ($LASTEXITCODE -ne 0) { echo "no previous preview release" }
          gh release create preview --prerelease --title preview --generate-notes dist/*.dll
