name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # msbuild is not on PATH under `shell: powershell` — this action adds it.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # The runner has neither a v2.0 nor a v4.0 targeting pack (only 4.8), and
      # retargeting to 4.8 would drop targets on older 4.x runtimes. The v2.0
      # runtime-dir fallback also references an AMD64 mscorlib, which MSB3270-flags
      # on the aarch64 image — the NuGet reference assemblies are arch-neutral and
      # fix both sides the same way.
      - name: Fetch reference assemblies (net20 + net40)
        run: |
          nuget install Microsoft.NetFramework.ReferenceAssemblies.net20 -Version 1.0.3 `
            -OutputDirectory refasms -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit 1 }
          nuget install Microsoft.NetFramework.ReferenceAssemblies.net40 -Version 1.0.3 `
            -OutputDirectory refasms -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # One image per (arch × CLR side) — the Assets-table rows resolve on
      # windows + netframework2/netframework4 + i386/x86_64/aarch64, so the asset
      # names carry the same vocabulary: csharp-agent-<side>-<arch>.dll.
      - name: Build all six images (Release)
        shell: powershell
        run: |
          $sides  = @(@('net2','v2.0'), @('net4','v4.0'))
          $arches = @(@('i386','x86'), @('x86_64','x64'), @('aarch64','ARM64'))
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($s in $sides) {
            # Import the matching package's own targets for each side (sets
            # TargetFrameworkRootPath + the mscorlib reference correctly).
            $pkg = Get-ChildItem refasms -Directory -Filter "Microsoft.NetFramework.ReferenceAssemblies.$($s[0])0*" | Select-Object -First 1
            $targets = Get-ChildItem "$($pkg.FullName)\build" -Filter '*.targets' | Select-Object -First 1
            if (-not $targets) { Write-Error "no .targets under $($pkg.FullName)\build"; exit 1 }
            $targets = $targets.FullName
            foreach ($a in $arches) {
              msbuild csharp-agent.csproj -restore `
                -p:Configuration=Release -p:Platform=$($a[1]) -p:TargetFrameworkVersion=$($s[1]) `
                -nologo -verbosity:minimal "-p:CustomAfterMicrosoftCommonTargets=$targets"
              if ($LASTEXITCODE -ne 0) { exit 1 }
              Copy-Item "bin\$($a[1])\Release\csharp-agent.dll" "dist\csharp-agent-$($s[0])-$($a[0]).dll"
              # Same image as a self-running EXE sibling: the runtime entry rides the same
              # guarded Main the deserialization ctor calls — run it directly with
              # H_URL/A_URL in the environment (isolates transport from the JS chain).
              # Separate OutputPath: sharing bin\$(Platform)\Release would let the exe
              # pass's IncrementalClean delete the just-copied dll as a stale output.
              msbuild csharp-agent.csproj `
                -p:Configuration=Release -p:Platform=$($a[1]) -p:TargetFrameworkVersion=$($s[1]) `
                -p:OutputType=exe "-p:OutputPath=bin\$($a[1])\Release-exe\" `
                -nologo -verbosity:minimal "-p:CustomAfterMicrosoftCommonTargets=$targets"
              if ($LASTEXITCODE -ne 0) { exit 1 }
              Copy-Item "bin\$($a[1])\Release-exe\csharp-agent.exe" "dist\csharp-agent-$($s[0])-$($a[0]).exe"
              # DEBUG flavor (-debug suffix): the #if DEBUG file-logger (src/Diag.cs) compiles
              # in ONLY here — one line per lifecycle/inject step to
              # csharp-agent-debug-<pid>.log next to the exe (or %TEMP% for the bytes-loaded
              # 0x0B dll). The plain assets above have NO diagnostics compiled in at all.
              # Separate OutputPaths again — IncrementalClean eats prior outputs in shared dirs.
              msbuild csharp-agent.csproj `
                -p:Configuration=Debug -p:Platform=$($a[1]) -p:TargetFrameworkVersion=$($s[1]) `
                "-p:OutputPath=bin\$($a[1])\Debug-dist\" `
                -nologo -verbosity:minimal "-p:CustomAfterMicrosoftCommonTargets=$targets"
              if ($LASTEXITCODE -ne 0) { exit 1 }
              Copy-Item "bin\$($a[1])\Debug-dist\csharp-agent.dll" "dist\csharp-agent-$($s[0])-$($a[0])-debug.dll"
              msbuild csharp-agent.csproj `
                -p:Configuration=Debug -p:Platform=$($a[1]) -p:TargetFrameworkVersion=$($s[1]) `
                -p:OutputType=exe "-p:OutputPath=bin\$($a[1])\Debug-dist-exe\" `
                -nologo -verbosity:minimal "-p:CustomAfterMicrosoftCommonTargets=$targets"
              if ($LASTEXITCODE -ne 0) { exit 1 }
              Copy-Item "bin\$($a[1])\Debug-dist-exe\csharp-agent.exe" "dist\csharp-agent-$($s[0])-$($a[0])-debug.exe"
            }
          }
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csharp-agent
          path: dist/*.dll
          if-no-files-found: error

      # Rolling "preview" prerelease — the URLs the C2's Agents-table CSharp-Agent rows
      # point at (releases/download/preview/csharp-agent-<side>-<arch>.dll), same mechanism
      # as the Position-Independent-Agent and jscript-agent repos. Recreated on every main push.
      - name: Publish rolling preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --yes --cleanup-tag 2>$null; if ($LASTEXITCODE -ne 0) { echo "no previous preview release" }
          gh release create preview --prerelease --title preview --generate-notes dist/*
