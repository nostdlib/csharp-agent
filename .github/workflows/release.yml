name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # One image per (arch × CLR side) — asset names carry the Agents-table tag vocabulary:
      # csharp-agent-<net2|net4>-<i386|x86_64|aarch64>.dll (same loop as build.yml).
      - name: Build all six images (Release)
        shell: powershell
        run: |
          $sides  = @(@('net2','v2.0'), @('net4','v4.0'))
          $arches = @(@('i386','x86'), @('x86_64','x64'), @('aarch64','ARM64'))
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($s in $sides) {
            foreach ($a in $arches) {
              msbuild csharp-agent.csproj `
                -p:Configuration=Release -p:Platform=$($a[1]) -p:TargetFrameworkVersion=$($s[1]) `
                -nologo -verbosity:minimal
              if ($LASTEXITCODE -ne 0) { exit 1 }
              Copy-Item "bin\$($a[1])\Release\csharp-agent.dll" "dist\csharp-agent-$($s[0])-$($a[0]).dll"
            }
          }
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-csharp-agent
          path: dist/*.dll
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-csharp-agent
          path: release-files

      - name: Determine tag
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes release-files/*
          fi
